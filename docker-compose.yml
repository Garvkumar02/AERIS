version: '3.8'

services:
  # FastAPI Enterprise Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aeris-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/aeris.db
      - SECRET_KEY=${SECRET_KEY}
      - FERNET_KEY=${FERNET_KEY}
      - FERNET_KEYS_ROTATION=${FERNET_KEYS_ROTATION:-}
      - CORS_ORIGINS=https://aeris.campus.edu
      - CAMERA_FEED_ENABLED=false
    volumes:
      - aeris-db-data:/app/data
      - aeris-backups:/app/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aeris-internal

  # React / Vite Admin Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aeris-dashboard
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - aeris-internal

  # Nginx Production SSL Reverse Proxy Gateway
  gateway:
    image: nginx:alpine-slim
    container_name: aeris-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-challenge:/var/www/certbot:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - aeris-internal

volumes:
  aeris-db-data:
    driver: local
  aeris-backups:
    driver: local
  certbot-challenge:
    driver: local

networks:
  aeris-internal:
    driver: bridge
